name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

  # Manual trigger with environment selection
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [dev, staging, prod]
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Ansible – Configure Servers
  # ─────────────────────────────────────────
  ansible-configure:
    name: Ansible Server Configuration
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ansible

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ANSIBLE_HOST }} >> ~/.ssh/known_hosts

      - name: Run Ansible playbook
        working-directory: ansible
        run: |
          ansible-playbook \
            -i playbooks/inventory/${{ inputs.environment || 'staging' }}.ini \
            playbooks/site.yml \
            --extra-vars "env=${{ inputs.environment || 'staging' }}" \
            -v
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

  # ─────────────────────────────────────────
  # JOB 2: Deploy to Kubernetes
  # ─────────────────────────────────────────
  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: ansible-configure
    environment: ${{ inputs.environment || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Set image tag
        id: image
        run: |
          TAG=${{ inputs.image_tag || 'latest' }}
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Update Kubernetes image tag
        run: |
          cd kubernetes/overlays/${{ inputs.environment || 'staging' }}
          kustomize edit set image \
            app=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -k kubernetes/overlays/${{ inputs.environment || 'staging' }} \
            --namespace=${{ inputs.environment || 'staging' }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/app \
            --namespace=${{ inputs.environment || 'staging' }} \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ inputs.environment || 'staging' }}
          kubectl get services -n ${{ inputs.environment || 'staging' }}

  # ─────────────────────────────────────────
  # JOB 3: Post-Deploy Health Check
  # ─────────────────────────────────────────
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy-kubernetes

    steps:
      - name: Run smoke tests
        run: |
          APP_URL=${{ secrets.APP_URL }}
          echo "Checking $APP_URL/health ..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health")
            if [ "$STATUS" == "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed (status: $STATUS). Retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 5 attempts"
          exit 1

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Deployment successful to ${{ inputs.environment || 'staging' }}",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true}
                ]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ Deployment failed to ${{ inputs.environment || 'staging' }}",
              "attachments": [{"color": "danger",
                "fields": [{"title": "Run URL", "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
