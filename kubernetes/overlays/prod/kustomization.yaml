apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

bases:
  - ../../base

namePrefix: prod-

replicas:
  - name: app
    count: 3

patches:
  - patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: production
    target:
      kind: ConfigMap
      name: app-config
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.example.com
    target:
      kind: Ingress
      name: app-ingress
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: Deployment
      name: app
