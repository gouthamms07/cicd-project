apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

bases:
  - ../../base

namePrefix: staging-

replicas:
  - name: app
    count: 1

patches:
  - patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: staging
    target:
      kind: ConfigMap
      name: app-config
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.app.example.com
    target:
      kind: Ingress
      name: app-ingress
